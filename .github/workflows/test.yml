name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest Go the module supports, as go.mod declares
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Once is enough, and the Windows checkout turns line endings into CRLF
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - run: go vet ./...

      - run: go test ./...

  # Something for a branch rule to require. Each leg above reports under its own name, such as
  # `test (windows-latest)`, which changes whenever the matrix does, and a required check that
  # no longer reports is not enforced. This job has one stable name that covers every leg.
  #
  # `always()` matters: without it this job is skipped when a leg fails, and a skipped required
  # check does not block a merge, so the gate would pass exactly when it should not. Running
  # unconditionally and asserting the result means a failed, cancelled or skipped matrix all
  # land as a failure here.
  test-ok:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      # For a matrix, `result` is success only when every leg succeeded.
      - env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $RESULT"
          [ "$RESULT" = 'success' ]
